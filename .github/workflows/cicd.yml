
name: ML CI/CD Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    name: Train Model and Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train machine learning model
        run: python model.py

      - name: Run automated tests
        run: python -m pytest -v test_model.py

  deploy:
    name: Deploy ML Webpage
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate webpage with model accuracy
        run: |
          python -c "from model import train_model; _, accuracy = train_model(); open('index.html', 'w').write(f'''<!DOCTYPE html><html lang=\"en\"><head><meta charset=\"UTF-8\"><meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"><title>ML CI/CD Pipeline</title></head><body><h1>Machine Learning CI/CD Pipeline</h1><h2>Model: Random Forest Classifier</h2><p>Dataset: Iris</p><p>Accuracy: {accuracy:.2%}</p><p>CI Tests: Passed</p><p>Deployment: Successful</p></body></html>''')"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
